# Test-only configuration for the ForgeOps backend.
#
# The RSA keys below are THROWAWAY TEST KEYS generated solely for the test suite. They are
# NOT production credentials and must never be used outside tests. Production keys are
# supplied via the environment / secret store (forgeops.security.jwt.private-key /
# public-key) and are never committed.

spring:
  # Enable publisher confirms in tests so RabbitTemplate.waitForConfirms works against the
  # Testcontainers RabbitMQ (matches the production default in application.yml). Host/port/
  # credentials are supplied by @ServiceConnection; this only sets the confirm mode.
  rabbitmq:
    publisher-confirm-type: simple

# Test-only: the RabbitMQ health contributor (added with spring-boot-starter-amqp) would make
# /actuator/health report DOWN in tests that start the context without a broker (e.g.
# HealthEndpointTests uses PostgreSQL only). Disabling it HERE keeps that test focused on
# datasource + Flyway health. Production keeps RabbitMQ health enabled (application.yml).
management:
  health:
    rabbit:
      enabled: false

forgeops:
  security:
    jwt:
      issuer: forgeops-test
      audience: forgeops-api
      access-token-ttl: PT15M
      # Test-only RSA keypair (PKCS#8 private / X.509 public), base64, single line.
      private-key: 
      public-key: 
  # Outbox publisher (Phase 6 Slice 2): disable the background poll timer in tests so it never
  # races test assertions. Publisher integration tests drive OutboxPublishService.publishBatch()
  # directly; the publish logic itself is unaffected by this flag.
  outbox:
    publisher:
      enabled: false
