# ForgeOps backend — default application configuration (Phase 2 foundation).
#
# This file holds safe, non-secret defaults only. Environment-specific values and
# secrets are supplied via environment variables / profile files, never hardcoded here.
# See application-local.yml for local development placeholders.

spring:
  application:
    name: forgeops-backend
  main:
    banner-mode: "off"

  # PostgreSQL datasource (authoritative store, ADR-0003). Values come from the environment;
  # no credentials are committed. There is no default password.
  datasource:
    url: ${FORGEOPS_DB_URL:jdbc:postgresql://localhost:5432/forgeops}
    username: ${FORGEOPS_DB_USERNAME:forgeops}
    password: ${FORGEOPS_DB_PASSWORD:}

  jpa:
    # The schema is owned by Flyway migrations; Hibernate only validates the mapping.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway owns the schema; migrations live in classpath:db/migration.
  flyway:
    enabled: true

  # RabbitMQ (Phase 6 Slice 2, ADR-0013): asynchronous transport only. Credentials come from
  # the environment; no secrets are committed and there is no default password. Publisher
  # confirms are enabled so the outbox publisher only marks a message PUBLISHED once the broker
  # has confirmed acceptance (ADR-0019).
  rabbitmq:
    host: ${FORGEOPS_RABBITMQ_HOST:localhost}
    port: ${FORGEOPS_RABBITMQ_PORT:5672}
    virtual-host: ${FORGEOPS_RABBITMQ_VHOST:/}
    username: ${FORGEOPS_RABBITMQ_USERNAME:guest}
    password: ${FORGEOPS_RABBITMQ_PASSWORD:}
    publisher-confirm-type: simple

server:
  port: ${SERVER_PORT:8080}

# Outbox publisher (Phase 6 Slice 2). Safe, non-secret defaults; overridable per environment.
# The publisher polls PENDING outbox rows, publishes them to RabbitMQ, marks them PUBLISHED on
# confirmed acceptance, and leaves failures retryable with capped exponential backoff.
forgeops:
  outbox:
    publisher:
      # ISO-8601 durations (PT5S = 5 seconds). @Scheduled's fixedDelayString and Boot's
      # Duration binding both accept this format; the plain "5s" form is NOT accepted by
      # @Scheduled.
      poll-delay: ${FORGEOPS_OUTBOX_POLL_DELAY:PT5S}
      batch-size: ${FORGEOPS_OUTBOX_BATCH_SIZE:100}
      backoff:
        base-delay: ${FORGEOPS_OUTBOX_BACKOFF_BASE:PT5S}
        max-delay: ${FORGEOPS_OUTBOX_BACKOFF_MAX:PT5M}
    # Outbox retention cleanup (Phase 6 Slice 4, PERSISTENCE_MODEL §15, INV-OUTBOX-006). A
    # periodic job prunes PUBLISHED rows older than the retention window in bounded batches;
    # PENDING/retryable rows are never deleted. ForgeOps v1 decision: retain 7 days (PT168H),
    # run hourly (PT1H), delete 500 rows per batch. ISO-8601 durations.
    cleanup:
      enabled: ${FORGEOPS_OUTBOX_CLEANUP_ENABLED:true}
      retention: ${FORGEOPS_OUTBOX_CLEANUP_RETENTION:PT168H}
      fixed-delay: ${FORGEOPS_OUTBOX_CLEANUP_FIXED_DELAY:PT1H}
      batch-size: ${FORGEOPS_OUTBOX_CLEANUP_BATCH_SIZE:500}
  # Incident detection/correlation (Phase 7 Slice 4). Sliding correlation window on the event's
  # server-side received_at within which a new event correlates to an existing active incident;
  # otherwise a new incident is created. ForgeOps v1: 30 minutes.
  incidents:
    detection:
      correlation-window: ${FORGEOPS_INCIDENT_CORRELATION_WINDOW:PT30M}
  events:
    rabbitmq:
      exchange: ${FORGEOPS_EVENTS_EXCHANGE:forgeops.events}
      queue: ${FORGEOPS_EVENTS_QUEUE:forgeops.events.processing}
      routing-key: ${FORGEOPS_EVENTS_ROUTING_KEY:operational-event.received}
      # Dead-letter topology (Phase 6 Slice 3): messages a consumer rejects after its retries
      # are exhausted are routed here by the broker (INV-MSG-006).
      dead-letter-exchange: ${FORGEOPS_EVENTS_DLX:forgeops.events.dlx}
      dead-letter-queue: ${FORGEOPS_EVENTS_DLQ:forgeops.events.processing.dlq}
      dead-letter-routing-key: ${FORGEOPS_EVENTS_DLRK:operational-event.dead-letter}
    # Asynchronous event consumer (Phase 6 Slice 3). Idempotent processing with explicit ack
    # after the DB commit, bounded retry of transient failures, and dead-letter on exhaustion.
    # Retry here is the CONSUMER policy, separate from the publisher backoff above.
    consumer:
      enabled: ${FORGEOPS_EVENTS_CONSUMER_ENABLED:true}
      concurrency: ${FORGEOPS_EVENTS_CONSUMER_CONCURRENCY:1}
      retry:
        max-attempts: ${FORGEOPS_EVENTS_CONSUMER_RETRY_MAX_ATTEMPTS:3}
        initial-delay: ${FORGEOPS_EVENTS_CONSUMER_RETRY_INITIAL_DELAY:PT2S}
        max-delay: ${FORGEOPS_EVENTS_CONSUMER_RETRY_MAX_DELAY:PT30S}

# Actuator: expose only the health endpoint in this phase. Prometheus, business metrics,
# and detailed monitoring are deferred to later phases (ARCHITECTURE.md §4.4).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
